<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArgusDE</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        color: #f5f5f5;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
      }
      form {
        width: 100%;
        max-width: 22rem;
        padding: 0 1.5rem;
      }
      h1 {
        margin: 0 0 0.25rem;
        font-size: 1.125rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 1rem;
        color: #a3a3a3;
        font-size: 0.875rem;
      }
      label {
        display: block;
        margin-bottom: 0.25rem;
        color: #737373;
        font-size: 0.75rem;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 0.5rem 0.75rem;
        border-radius: 0.5rem;
        border: 1px solid #404040;
        background: #171717;
        color: #f5f5f5;
        font-size: 0.875rem;
      }
      input:focus {
        outline: none;
        border-color: #8b5cf6;
      }
      button {
        width: 100%;
        margin-top: 1rem;
        padding: 0.5rem 1rem;
        border: none;
        border-radius: 0.5rem;
        background: #7c3aed;
        color: white;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover {
        background: #6d28d9;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #error {
        margin-top: 0.75rem;
        color: #f87171;
        font-size: 0.875rem;
        display: none;
      }
    </style>
  </head>
  <body>
    <form id="connect-form">
      <h1>ArgusDE</h1>
      <p>Not connected. Enter the address of a running <code>argusde serve</code>.</p>
      <label for="server-url">Server URL</label>
      <input id="server-url" name="server-url" type="text" placeholder="http://127.0.0.1:4870/" autocomplete="off" />
      <button type="submit">Connect</button>
      <p id="error"></p>
    </form>
    <script src="./main.js"></script>
  </body>
</html>
