# pnpm's default for this flipped between major versions (false through pnpm 9,
# true from 10). `pnpm test` depends on it: the `pretest` hook is what
# typechecks and builds before vitest runs, so losing it would leave both local
# runs and CI testing a stale dist while still reporting green. Pinned rather
# than inherited.
#
# Lives here rather than in .npmrc so npm stops warning "Unknown project config"
# on every npx invocation — this is a pnpm setting, and pnpm-workspace.yaml is
# where pnpm's own settings already live.
enablePrePostScripts: true

allowBuilds:
  better-sqlite3: true
  # node-pty is the terminal's PTY binding (spec #128 phase 1). Native, like
  # better-sqlite3 — and like it, built for plain Node: the server runs as
  # `node dist/server/cli.js serve`, not inside Electron, so no electron-rebuild.
  node-pty: true
  electron: true
  esbuild: true
